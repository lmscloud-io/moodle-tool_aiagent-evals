name: Evaluations

on:
  workflow_dispatch:
    inputs:
      distrtest_ref:
        description: DISTR-TEST branch or tag to evaluate
        required: true
        default: main
      tier:
        description: Tier to run
        type: choice
        options: [compat, models]
        default: compat
      moodle:
        description: Comma-separated Moodle branches (e.g. 405,502); empty for the tier's own
        default: ''
      cells:
        description: Comma-separated cell id globs
        default: '*'
      tasks:
        description: Comma-separated task id globs
        default: '*'
      publish:
        description: Open a pull request with the scoreboard on the docs repo
        type: boolean
        default: false

permissions:
  contents: read

env:
  DISTRTEST_REPO: https://x-access-token:${{ secrets.DISTRTEST_READ_TOKEN }}@github.com/lmscloud-io/moodle-tool_aiagent-distrtest.git

jobs:
  plan:
    if: github.repository == 'lmscloud-io/moodle-tool_aiagent-evals'
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - id: branches
        env:
          REF: ${{ inputs.distrtest_ref }}
          TIER: ${{ inputs.tier }}
          MOODLE: ${{ inputs.moodle }}
        run: echo "branches=$(aiagent-evals branches --distrtest-ref "$REF" --tier "$TIER" --moodle "$MOODLE")" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: plan
    if: github.repository == 'lmscloud-io/moodle-tool_aiagent-evals'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.plan.outputs.branches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Run the tier
        env:
          TOOL_AIAGENT_TEST_LICENSE_KEY: ${{ secrets.TOOL_AIAGENT_TEST_LICENSE_KEY }}
          TOOL_AIAGENT_TEST_API_ENDPOINT_STAGING: ${{ secrets.TOOL_AIAGENT_TEST_API_ENDPOINT_STAGING }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          REF: ${{ inputs.distrtest_ref }}
          TIER: ${{ inputs.tier }}
          CELLS: ${{ inputs.cells }}
          TASKS: ${{ inputs.tasks }}
          BRANCH: ${{ matrix.branch }}
        run: aiagent-evals run --distrtest-ref "$REF" --tier "$TIER" --moodle "$BRANCH" --cells "$CELLS" --tasks "$TASKS" --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.branch }}
          path: results/
          retention-days: 90

  publish:
    needs: evaluate
    if: github.repository == 'lmscloud-io/moodle-tool_aiagent-evals' && inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: downloaded
      - uses: actions/checkout@v4
        with:
          repository: lmscloud-io/moodle-tool_aiagent-docs
          token: ${{ secrets.DOCS_PR_TOKEN }}
          path: docs
      - run: aiagent-evals publish --results 'downloaded/*/results.json' --docs-dir docs
      - name: Open the pull request
        working-directory: docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_PR_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "evals/run-$RUN_ID"
          git add evals
          git commit -m "Evaluation results from run $RUN_ID"
          git push origin "evals/run-$RUN_ID"
          gh pr create --base main --title "Evaluation results (run $RUN_ID)" \
            --body "Generated by the Evaluations workflow, run $RUN_ID. Check the tables before merging."
